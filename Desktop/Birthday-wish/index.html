<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive;
      color: white;
    }
    #countdown {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 5rem;
      color: yellow;
      z-index: 1000;
      text-shadow: 0 0 10px red;
    }
    #birthdayMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 3rem;
      color: #fff;
      text-shadow: 2px 2px 10px red;
      text-align: center;
      z-index: 1000;
      animation: boom 1s ease-out forwards;
      animation-delay: 5s;
    }
    @keyframes boom {
      to {
        transform: translate(-50%, -50%) scale(1.5);
      }
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="countdown">5</div>
  <div id="birthdayMessage">🎉 Happy Birthday My Love! ❤️🎂🎈</div>
  <canvas id="fireworks"></canvas>

  <audio id="birthday-audio">
    <source src="happy-birthday-254480.mp3" type="audio/mpeg">
  </audio>

  <script>
    // // Countdown
    // let count = 5;
    // const countdownEl = document.getElementById('countdown');
    // const birthdayMessage = document.getElementById('birthdayMessage');
    // const birthdayAudio = document.getElementById('birthday-audio');

    // const countdownInterval = setInterval(() => {
    //   count--;
    //   countdownEl.innerText = count;
    //   if (count === 0) {
    //     clearInterval(countdownInterval);
    //     countdownEl.style.display = 'none';
    //     birthdayMessage.style.animationPlayState = 'running';
    //     birthdayAudio.play();
    //     launchFireworks();
    //   }
    // }, 1000);

    // Firework Canvas
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    function createFirework(x, y) {
      const colors = ['#ff0', '#f0f', '#0ff', '#f00', '#0f0', '#00f'];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x,
          y,
          radius: Math.random() * 2 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          angle: Math.random() * 2 * Math.PI,
          speed: Math.random() * 5 + 2,
          life: 100
        });
      }
    }

    function updateFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;
        p.life--;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, 2 * Math.PI);
        ctx.fillStyle = p.color;
        ctx.fill();
        if (p.life <= 0) particles.splice(index, 1);
      });
    }

    function launchFireworks() {
      setInterval(() => {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height / 2;
        createFirework(x, y);
      }, 800);
    }

    function animate() {
      updateFireworks();
      requestAnimationFrame(animate);
    }
    animate();


    // Countdown
    let count = 5;
    const countdownEl = document.getElementById('countdown');
    const birthdayMessage = document.getElementById('birthdayMessage');
    const birthdayAudio = document.getElementById('birthday-audio');

    // Add an event listener to allow audio play after user interaction
    document.body.addEventListener('click', () => {
      birthdayAudio.play(); // Play audio when user clicks anywhere
    });

    const countdownInterval = setInterval(() => {
      count--;
      countdownEl.innerText = count;
      if (count === 0) {
        clearInterval(countdownInterval);
        countdownEl.style.display = 'none';
        birthdayMessage.style.animationPlayState = 'running';
        launchFireworks();
      }
    }, 1000);
    
  </script>
</body>
</html>
